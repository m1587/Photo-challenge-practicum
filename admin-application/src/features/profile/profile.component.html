<div class="profile-container">
  <mat-card class="profile-card">
    <mat-card-header>
      <div class="header-content">
        <div class="profile-avatar">
          <span>{{ getUserInitials() }}</span>
        </div>
        <div class="header-text">
          <mat-card-title>My Profile</mat-card-title>
          <mat-card-subtitle>Manage your account information</mat-card-subtitle>
        </div>
      </div>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="profileForm">
        <div class="form-section">
          <h3>Personal Information</h3>
          
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Full Name</mat-label>
             <input matInput formControlName="name" placeholder="Your full name" [disabled]="true">
            <mat-icon matPrefix>person</mat-icon>
            <mat-error *ngIf="profileForm.get('name')?.hasError('required')">
              Name is required
            </mat-error>
          </mat-form-field>
          
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Email Address</mat-label>
            <input matInput formControlName="email" placeholder="Your email address" type="email" [disabled]="true">
            <mat-icon matPrefix>email</mat-icon>
            <mat-error *ngIf="profileForm.get('email')?.hasError('required')">
              Email is required
            </mat-error>
            <mat-error *ngIf="profileForm.get('email')?.hasError('email')">
              Please enter a valid email address
            </mat-error>
          </mat-form-field>
        </div>
        
        <mat-divider></mat-divider>     
        <div class="form-section">
          <h3>Account Information</h3>
          
          <div class="info-row">
            <div class="info-label">
              <mat-icon>badge</mat-icon>
              <span>Role</span>
            </div>
            <div class="info-value">
              <span class="role-badge">{{ currentUser?.role }}</span>
            </div>
          </div>
          
          <div class="info-row">
            <div class="info-label">
              <mat-icon>verified</mat-icon>
              <span>Account Status</span>
            </div>
            <div class="info-value">
              <span class="status-badge">Active</span>
            </div>
          </div>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
